services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: riviera-painel-comercial:latest
    ports:
      - "8011:80"
    environment:
      APP_NAME: "Painel Comercial Riviera"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8011
      APP_KEY: "base64:E+O8HQb4B7PrUFCY/xlECMI/4EJCCqgm6xzLCLzi9P8="
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/storage/app/data/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    volumes:
      - panel-data:/var/www/html/storage/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  panel-data:
